{% extends "core/planning.html" %}

    <a href="{% url 'planning_overview' %}" class="btn btn-outline-secondary">Back</a>
  </div>
  <section class="planning-section">

      <div class="col-md-6 col-lg-4">

        </a>
      </div>
      <div class="col-md-6 col-lg-4">
        <a href="{% url 'standard_strength_list' %}" class="card h-100 planning-card text-decoration-none text-reset">
