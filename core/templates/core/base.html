{% load static %}
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>{% block title %}MiLa{% endblock %}</title>
    <meta name="theme-color" content="#17324D">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="MiLa">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'core/brand/app/mila-app-32x32.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'core/brand/app/mila-app-180x180.png' %}">
    <link rel="manifest" href="{% static 'core/brand/app/site.webmanifest' %}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>

    {% block extra_head %}{% endblock %}
    <style>
      .mila-logout {
        position: fixed;
        top: 10px;
        right: 10px;
        z-index: 1080;
      }
    </style>
  </head>

  <body>
    {% if request.user.is_authenticated %}
      <form method="post" action="{% url 'logout' %}" class="mila-logout">
        {% csrf_token %}
        <button type="submit" class="btn btn-sm btn-outline-secondary bg-white">Logout</button>
      </form>
    {% endif %}
    {% block content %}{% endblock %}
    {% block extra_js %}{% endblock %}
  </body>
</html>
