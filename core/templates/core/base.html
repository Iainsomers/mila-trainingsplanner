{% load static %}
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>{% block title %}MiLa{% endblock %}</title>
    <meta name="theme-color" content="#17324D">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="MiLa">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'core/brand/app/mila-app-32x32.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'core/brand/app/mila-app-180x180.png' %}">
    <link rel="manifest" href="{% static 'core/brand/app/site.webmanifest' %}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>

    {% block extra_head %}{% endblock %}
    <style>
      .mila-page-content {
        padding-top: 0;
      }

      .mila-page-content > .container > .d-flex:first-child,
      .mila-page-content > .container-fluid > .d-flex:first-child,
      .mila-page-content > main > .d-flex:first-child,
      .mila-page-content > .d-flex:first-child {
        padding-right: 92px;
      }

      .mila-logout {
        position: fixed;
        top: 10px;
        right: 10px;
        z-index: 1080;
      }

      {% if team_branding %}
      .mila-team-branded {
        position: relative;
        isolation: isolate;
        --mila-team-color-1: {{ team_branding.color_1|default:"#000000" }};
        --mila-team-color-2: {{ team_branding.color_2|default:"#000000" }};
      }

      .mila-team-branded h1,
      .mila-team-branded h2,
      .mila-team-branded h3,
      .mila-team-branded h4,
      .mila-team-branded h5,
      .mila-team-branded h6 {
        color: var(--mila-team-color-1);
      }

      .mila-team-branded .btn {
        color: var(--mila-team-color-2) !important;
      }

      {% if team_branding.logo_url %}
      .mila-team-branded::before {
        content: "";
        position: fixed;
        inset: 3.5rem 0 0;
        z-index: 0;
        pointer-events: none;
        background: url("{{ team_branding.logo_url }}") center center / auto 86% no-repeat;
        opacity: 0.075;
      }

      .mila-team-branded > * {
        position: relative;
        z-index: 1;
      }
      {% endif %}
      {% endif %}
    </style>
  </head>

  <body>
    {% if request.user.is_authenticated %}
      <form method="post" action="{% url 'logout' %}" class="mila-logout">
        {% csrf_token %}
        <button type="submit" class="btn btn-sm btn-outline-secondary bg-white">Logout</button>
      </form>
    {% endif %}
    <div class="mila-page-content{% if team_branding %} mila-team-branded{% endif %}">
      {% block content %}{% endblock %}
    </div>
    {% block extra_js %}{% endblock %}
  </body>
</html>
