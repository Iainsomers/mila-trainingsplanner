<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>{% block title %}MiLa{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>

    {% block extra_head %}{% endblock %}
    <style>
      .mila-logout {
        position: fixed;
        top: 10px;
        right: 10px;
        z-index: 1080;
      }
    </style>
  </head>

  <body>
    {% if request.user.is_authenticated %}
      <form method="post" action="{% url 'logout' %}" class="mila-logout">
        {% csrf_token %}
        <button type="submit" class="btn btn-sm btn-outline-secondary bg-white">Logout</button>
      </form>
    {% endif %}
    {% block content %}{% endblock %}
  </body>
</html>
