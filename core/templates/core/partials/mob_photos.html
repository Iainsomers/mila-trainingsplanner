<div class="d-flex flex-wrap gap-2 mt-1">
  {% for photo in mob_photos %}
    <div class="d-flex flex-column align-items-start">
      <a href="{{ photo.url }}" target="_blank" rel="noopener" title="Open training photo" onclick="event.stopPropagation();">
        <img src="{{ photo.url }}?thumb=1" alt="Mob/Tech training photo" loading="lazy" style="width:64px;height:64px;object-fit:contain;border:1px solid #dee2e6;border-radius:4px;background:white;">
      </a>
      {% if editable %}<label class="small"><input type="checkbox" name="remove_mob_photo" value="{{ photo.id }}"> Remove</label>{% endif %}
    </div>
  {% endfor %}
</div>
