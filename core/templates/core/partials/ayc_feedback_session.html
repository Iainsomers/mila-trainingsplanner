<button type="button" class="report-preview-half" data-evaluation-slot="{{ slot }}"
        aria-label="Evaluate {{ session }}">
  <span class="report-preview-top">
    <span class="report-preview-slot">{{ session }}</span>
    {% with status=check.effective_status|default:"none" %}
      <span class="check-status-toggle report-preview-status status-{{ status }}" aria-hidden="true">
        {% if status == "done_as_planned" or status == "adjusted_ok" %}✓{% elif status == "too_hard_fast" %}↑{% elif status == "lighter_slower" %}↓{% elif status == "not_done" %}✕{% endif %}
      </span>
    {% endwith %}
    <span class="report-preview-rpe" title="RPE">{% if check and check.rpe != None %}{{ check.rpe }}{% else %}—{% endif %}</span>
    {% if check.pain %}
      <span title="{% if check.pain == 'no_pain' %}Fit{% elif check.pain == 'some_pain' %}Some issues, pls explain!{% else %}Serious issue, talk to staff!{% endif %}">{% if check.pain == 'no_pain' %}🟢{% elif check.pain == 'some_pain' %}🟠{% else %}🔴{% endif %}</span>
    {% endif %}
  </span>
  <span class="report-preview-text">{% if check.comment %}{{ check.comment }}{% elif check.watch_activity_summary %}{{ check.watch_activity_summary }}{% endif %}</span>
</button>
