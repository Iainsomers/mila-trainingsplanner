<div class="table-responsive"><table class="table table-sm"><thead><tr><th>Lap</th><th>Distance (m)</th><th>Distance rounded to 50 m</th><th>Duration</th><th>min/km</th><th>Z / T pace</th><th>Split time since start</th></tr></thead><tbody>{% for row in rows %}<tr><td>{{ row.index }}</td><td>{{ row.distance }}</td><td>{{ row.distance_rounded_50 }}</td><td>{{ row.duration }}</td><td>{{ row.pace }}</td><td>{{ row.zone_pace }}</td><td>{{ row.elapsed }}</td></tr>{% empty %}<tr><td colspan="7">No laps supplied.</td></tr>{% endfor %}</tbody></table></div>
